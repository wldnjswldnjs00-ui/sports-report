name: 정기 실행 시계

# Cloudflare 예약(GH_TOKEN 필요)과 GitHub 자체 예약이 모두 멈춰도 정해진 시각 작업이 돌게 하는 세 번째 시계.
# - 한 번 시작하면 약 5시간 40분 동안 1분마다 시각을 보고, 정해진 시각의 '매일 분석'이 아직 없으면 시작한다.
# - 끝나기 직전에 자기 자신을 다시 시작해 끊기지 않고 이어진다(GITHUB_TOKEN 만 사용, 따로 넣을 비밀 값 없음).
# - 같은 시계는 하나만 돈다(concurrency). '매일 분석'이 끝날 때 시계가 없으면 다시 켠다.
# - 이미 실행된 시각은 건너뛰므로 Cloudflare·지킴이·시계가 겹쳐도 한 번만 돈다.
# 공개 저장소의 GitHub Actions 는 사용 시간 제한이 없다.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 1분마다 정해진 시각 확인 → 빠진 실행 시작
        uses: actions/github-script@v7
        with:
          script: |
            // cron/worker.js 의 SCHEDULE 과 같아야 한다(UTC "HH:MM" → 슬롯)
            const SCHEDULE = {
              "14:05": "5 14 * * *", "21:00": "0 21 * * *", "22:00": "0 22 * * *", "00:30": "30 0 * * *", "03:30": "30 3 * * *",
              "04:00": "0 4 * * *", "09:00": "0 9 * * *", "10:00": "0 10 * * *", "13:00": "0 13 * * *",
            };
            const { owner, repo } = context.repo;
            const START = Date.now(), RUN_FOR = 340 * 60000;
            const done = new Set();
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            async function ranSince(slot, t) {
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: "daily.yml", per_page: 30,
                created: ">=" + new Date(t - 10 * 60000).toISOString().slice(0, 19) + "Z" })).data.workflow_runs;
              return runs.some((r) => r.display_title === `매일 분석 · ${slot}` || String((r.head_commit || {}).message || "").includes(`[slot:${slot}]`));
            }
            while (Date.now() - START < RUN_FOR) {
              const now = Date.now();
              for (const [hm, slot] of Object.entries(SCHEDULE)) {
                const [h, mi] = hm.split(":").map(Number);
                for (const shift of [0, -1]) {
                  const d = new Date(now); d.setUTCDate(d.getUTCDate() + shift); d.setUTCHours(h, mi, 0, 0);
                  const age = (now - d.getTime()) / 60000;
                  const key = slot + "@" + d.toISOString().slice(0, 10);
                  // Cloudflare 가 먼저 시작할 수 있게 2분 기다린 뒤, 30분 안에서만
                  if (age < 2 || age > 30 || done.has(key)) continue;
                  try {
                    if (await ranSince(slot, d.getTime())) { done.add(key); continue; }
                    await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "daily.yml", ref: "main", inputs: { slot } });
                    core.info(`시작: ${slot}`); done.add(key);
                  } catch (e) { core.warning(`${slot}: ${e.message}`); }
                }
              }
              await sleep(60000);
            }
            // 이어달리기: 다음 시계를 켠다(대기열에 올라가 지금 시계가 끝나면 바로 시작)
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "clock.yml", ref: "main" });
            core.info("다음 시계 시작");
