name: 매일 분석

on:
  schedule:
    - cron: "5 14 * * *"   # 23:05 KST  구매일이 바뀌면(23시) 바로 다음 구매일 리포트
    - cron: "0 21 * * *"   # 06:00 KST  새 날짜 리포트 + 전날 결과 채점(결과 API 호출)
    - cron: "0 22 * * *"   # 07:00 KST  아침 재수집 + 쓰레드 아침 게시
    - cron: "30 0 * * *"   # 09:30 KST  발매 경기 재수집
    - cron: "0 4 * * *"    # 13:00 KST  재수집
    - cron: "0 9 * * *"    # 18:00 KST  배당 갱신(해외 배당 새로고침)
    - cron: "0 10 * * *"   # 19:00 KST  재수집 + 다음 구매일 분석 생성·공개
    - cron: "0 13 * * *"   # 22:00 KST  다음 구매일 분석 미리 생성 + 쓰레드 밤 게시
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/manual/**", "data/results/manual/**", "data/aliases.json", "engine/sources/**", "engine/analysis/**"]

concurrency:
  # 이름을 바꿔 둠: 예전에 GitHub 쪽에서 '대기'로 멈춰 취소도 안 되는 실행(30번)이 이 묶음을 붙잡지 않게
  group: pipeline-v2
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # 자동 점검 경고를 이슈로 남긴다(이메일 알림)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m unittest -q
      - name: 수집·분석·채점
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          ARGS=""
          # 해외 배당 새로고침: 18:00, 그리고 아침 쓰레드 게시 전 07:00(밤사이 바뀐 배당 반영, API 잔여량이 부족하면 엔진이 알아서 건너뜀)
          [ "${{ github.event.schedule }}" = "0 9 * * *" ] && ARGS="$ARGS --refresh"
          [ "${{ github.event.schedule }}" = "0 22 * * *" ] && ARGS="$ARGS --refresh"
          [ "${{ github.event.schedule }}" != "0 21 * * *" ] && [ "${{ github.event_name }}" = "schedule" ] && ARGS="$ARGS --no-scores"
          python -m engine run $ARGS
          # 22:00: 23시 전환 전에 다음 구매일 분석을 미리 만들어 둔다(쓰레드 밤 게시용, 사이트 첫 화면은 23시까지 오늘 그대로)
          # 19:00·22:00: 다음 구매일 분석을 만든다(19시부터 사이트에 '내일 분석'으로 공개, 22시는 쓰레드용으로 다시 갱신)
          if [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            python -m engine collect --date "$(TZ=Asia/Seoul date -d tomorrow +%F)"
          fi
      - name: 쓰레드 카드 준비(밤 22:00·아침 07:00, 토큰이 있을 때만)
        id: tprep
        if: github.event.schedule == '0 13 * * *' || github.event.schedule == '0 22 * * *'
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
          python -m engine threads --prepare
      - name: 자동 점검(커밋 전에 실행해 연속 실패 기록을 남김, 문제가 이어지면 GitHub 이슈로 알림 → 이메일)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m engine health
      - name: 사이트 빌드 검증
        id: build
        if: always()
        run: python -m engine build
      - name: 데이터 커밋
        id: commit
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 갱신"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
      - name: 쓰레드 게시(배포된 카드 이미지로 캐러셀)
        if: steps.commit.outputs.pushed == '1' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '0 22 * * *')
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python -m engine threads --post
          git add data/state/threads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 게시 기록"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 검색엔진에 새 페이지 알림(IndexNow)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          python -m engine build >/dev/null
          python -m engine indexnow
