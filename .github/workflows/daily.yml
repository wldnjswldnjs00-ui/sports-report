name: 매일 분석

on:
  schedule:
    - cron: "5 15 * * *"   # 00:05 KST  날짜가 바뀌면 바로 새 리포트
    - cron: "0 21 * * *"   # 06:00 KST  새 날짜 리포트 + 전날 결과 채점(결과 API 호출)
    - cron: "30 0 * * *"   # 09:30 KST  발매 경기 재수집
    - cron: "0 4 * * *"    # 13:00 KST  재수집
    - cron: "0 7 * * *"    # 16:00 KST  재수집
    - cron: "0 9 * * *"    # 18:00 KST  배당 갱신(해외 배당 새로고침)
    - cron: "0 11 * * *"   # 20:00 KST  재수집
    - cron: "30 13 * * *"  # 22:30 KST  심야 경기 직전 재수집
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/manual/**", "data/results/manual/**", "data/aliases.json", "engine/sources/**", "engine/analysis/**"]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m unittest -q
      - name: 수집·분석·채점
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          ARGS=""
          [ "${{ github.event.schedule }}" = "0 9 * * *" ] && ARGS="$ARGS --refresh"
          [ "${{ github.event.schedule }}" != "0 21 * * *" ] && [ "${{ github.event_name }}" = "schedule" ] && ARGS="$ARGS --no-scores"
          python -m engine run $ARGS
      - name: Threads 게시(키가 있을 때만, 하루 한 번)
        if: github.event.schedule == '30 0 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python -m engine threads
      - name: 사이트 빌드 검증
        id: build
        if: always()
        run: python -m engine build
      - name: 데이터 커밋
        id: commit
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 갱신"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
      - name: 검색엔진에 새 페이지 알림(IndexNow)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          sleep 150   # Cloudflare 배포가 끝날 때까지 대기
          python -m engine build >/dev/null
          python -m engine indexnow
