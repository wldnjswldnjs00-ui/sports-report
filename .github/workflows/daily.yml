name: 매일 분석

# 정기 실행은 Cloudflare Worker 의 예약 실행(cron/worker.js)이 정해진 시각에 이 워크플로를 시작한다(slot = 그 시각의 cron).
# GitHub 자체 schedule 은 이 저장소에서 한 번도 실행되지 않았고 늦게 도는 일이 잦아서 쓰지 않는다(겹쳐 두 번 도는 것도 방지).
#   23:05 "5 14 * * *"  다음 구매일 리포트      06:00 "0 21 * * *"  새 리포트 + 전날 채점(결과 API)
#   07:00 "0 22 * * *"  재수집 + 쓰레드 아침(빠지면 09:30 이 대신)    09:30 "30 0 * * *"  재수집
#   17:00 "0 8 * * *"   쓰레드 밤 빅매치 미리보기(수집 없음)
#   11:00 "0 2 * * *"   쓰레드 전날 결과(수집 없음)   15:00 "0 6 * * *" 쓰레드 노하우(수집 없음)
#   release          새 회차 발매 직후(Cloudflare Worker 가 10분마다 감지) → 회차·경기 페이지를 먼저 만들고 검색엔진에 알림
#   13:00 "0 4 * * *"   재수집                  18:00 "0 9 * * *"   해외 배당 새로고침
#   19:00 "0 10 * * *"  다음 구매일 분석 공개 + 쓰레드 저녁    22:00 "0 13 * * *"  다음 구매일 분석(쓰레드 저녁 예비)
run-name: ${{ inputs.slot && format('매일 분석 · {0}', inputs.slot) || (github.event_name == 'push' && '코드 반영 실행' || '매일 분석 (수동)') }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "정기 실행 시각(cron 문자열). 비우면 일반 수동 실행"
        required: false
        default: ""
  push:
    branches: [main]
    # 코드 변경(engine/**)은 다음 정해진 시각에 반영된다 → 커밋마다 전체 실행을 돌려 무료 시간을 쓰지 않는다
    paths: ["data/manual/**", "data/results/manual/**", "data/aliases.json"]

concurrency:
  # 이름을 바꿔 둠: 예전에 GitHub 쪽에서 '대기'로 멈춰 취소도 안 되는 실행(30번)이 이 묶음을 붙잡지 않게
  group: pipeline-v2
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # 쓰레드가 안 올라갔을 때 '쓰레드 다시 올리기'를 바로 시작한다(빠지면 시작 요청이 거절됨)
  issues: write   # 자동 점검 경고를 이슈로 남긴다(이메일 알림)
  id-token: write # 쓰레드 토큰을 Cloudflare Worker 에서 받을 때 GitHub 신원 증명(OIDC)을 쓴다

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SLOT: ${{ inputs.slot || github.event.schedule || '' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      # 예비 경로: Cloudflare 예약 실행이 안 될 때 '[slot:0 10 * * *]' 같은 커밋으로 그 시각의 작업을 그대로 돌린다
      - name: 커밋 메시지의 시각 슬롯
        if: github.event_name == 'push'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          s=$(printf '%s' "$MSG" | grep -o '\[slot:[^]]*\]' | head -1 | sed 's/^\[slot:\(.*\)\]$/\1/')
          if [ -n "$s" ]; then echo "SLOT=$s" >> "$GITHUB_ENV"; echo "슬롯: $s"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치(네트워크가 잠깐 끊겨도 다시)
        run: for i in 1 2 3; do pip install -r requirements.txt && break; sleep 15; done
      - name: 무료 실행 시간 확인(한도에 가까우면 예비 시각은 건너뜀)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(python -m engine budget | tail -1)
          echo "결정: $d"
          if [ "$d" = "skip" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: 테스트
        continue-on-error: true  # 테스트 하나가 깨져도 사이트 갱신·쓰레드는 멈추지 않게(문제는 자동 점검이 알림)
        run: python -m unittest -q
      - name: 수집·분석·채점
        if: env.SKIP != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          ARGS=""
          # 해외 배당 새로고침: 18:00, 그리고 아침 쓰레드 게시 전 07:00(밤사이 바뀐 배당 반영, API 잔여량이 부족하면 엔진이 알아서 건너뜀)
          [ "$SLOT" = "0 9 * * *" ] && ARGS="$ARGS --refresh"
          [ "$SLOT" = "0 22 * * *" ] && ARGS="$ARGS --refresh"
          [ "$SLOT" != "0 21 * * *" ] && [ -n "$SLOT" ] && ARGS="$ARGS --no-scores"
          work() {
            python -m engine run $ARGS
            # 22:00: 23시 전환 전에 다음 구매일 분석을 미리 만들어 둔다(쓰레드 밤 게시용, 사이트 첫 화면은 23시까지 오늘 그대로)
            # 19:00·22:00: 다음 구매일 분석을 만든다(19시부터 사이트에 '내일 분석'으로 공개, 22시는 쓰레드용으로 다시 갱신)
            if [ "$SLOT" = "0 10 * * *" ] || [ "$SLOT" = "0 13 * * *" ]; then
              python -m engine collect --date "$(TZ=Asia/Seoul date -d tomorrow +%F)"
            fi
          }
          # 11:00·15:00 은 쓰레드 게시만 하는 시각이라 수집을 건너뛴다(실행 시간 절약)
          if [ "$SLOT" = "0 2 * * *" ] || [ "$SLOT" = "0 6 * * *" ] || [ "$SLOT" = "0 8 * * *" ]; then echo "쓰레드 전용 시각"; exit 0; fi
          work
          # 베트맨 접속이 실패해도 여기서 기다리지 않는다(기다리는 동안 무료 시간이 줄어듦).
          # 쓰레드 시각이면 끝에서 '쓰레드 다시 올리기'가 경기를 다시 받아 오고, 아니면 다음 정해진 시각이 이어받는다.
      - name: 쓰레드 카드 준비(저녁 19:00·아침 07:00, 빠지면 22:00·09:30 실행이 대신. 같은 글은 한 번만)
        id: tprep
        if: always() && env.SKIP != '1' && (env.SLOT == '0 10 * * *' || env.SLOT == '0 13 * * *' || env.SLOT == '0 22 * * *' || env.SLOT == '30 0 * * *' || contains(github.event.head_commit.message, '[threads-now]'))
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_SLOT: ${{ contains(github.event.head_commit.message, '[threads-now]') && 'night' || '' }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          source .github/scripts/chrome.sh
          python -m engine threads --prepare
      - name: 쓰레드 노하우 카드 묶음 준비(15:00, 빠지면 22:00)
        if: always() && env.SKIP != '1' && (env.SLOT == '0 6 * * *' || env.SLOT == '0 13 * * *' || contains(github.event.head_commit.message, '[threads-kh]'))
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          source .github/scripts/chrome.sh
          python -m engine threads --knowhow-prepare
      - name: 쓰레드 전날 결과 카드 준비(11:00, 결과가 덜 나왔으면 13:00·18:00 실행이 대신. 하루 한 번)
        if: always() && env.SKIP != '1' && (env.SLOT == '0 2 * * *' || env.SLOT == '0 4 * * *' || env.SLOT == '0 9 * * *' || contains(github.event.head_commit.message, '[threads-result]'))
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          source .github/scripts/chrome.sh
          python -m engine threads --result-prepare
      - name: 쓰레드 빅매치 미리보기 준비(09:30·13:00 투표·17:00·22:00, 경기 3시간 이상 전 칸)
        if: always() && env.SKIP != '1' && (env.SLOT == '30 0 * * *' || env.SLOT == '0 4 * * *' || env.SLOT == '0 8 * * *' || env.SLOT == '0 13 * * *' || contains(github.event.head_commit.message, '[threads-pv]'))
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          source .github/scripts/chrome.sh
          python -m engine threads --pv-prepare
      - name: 자동 점검(커밋 전에 실행해 연속 실패 기록을 남김, 문제가 이어지면 GitHub 이슈로 알림 → 이메일)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m engine health
      - name: 사이트 빌드 검증
        id: build
        if: always()
        run: python -m engine build
      - name: 데이터 커밋
        id: commit
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 갱신"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
      - name: 쓰레드 게시(배포된 카드 이미지로 캐러셀)
        if: steps.commit.outputs.pushed == '1' && (env.SLOT == '0 10 * * *' || env.SLOT == '0 13 * * *' || env.SLOT == '0 22 * * *' || env.SLOT == '30 0 * * *' || contains(github.event.head_commit.message, '[threads-now]'))
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python -m engine threads --post
          git add data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 게시 기록"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 쓰레드 노하우 카드 묶음 게시(15:00, 빠지면 22:00. 하루 한 편)
        if: steps.commit.outputs.pushed == '1' && (env.SLOT == '0 6 * * *' || env.SLOT == '0 13 * * *' || contains(github.event.head_commit.message, '[threads-kh]'))
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python -m engine threads --knowhow
          git add data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 노하우 게시 기록"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 쓰레드 빅매치 미리보기 게시(13:00 은 투표, 안 되면 카드 글로)
        if: steps.commit.outputs.pushed == '1' && (env.SLOT == '30 0 * * *' || env.SLOT == '0 4 * * *' || env.SLOT == '0 8 * * *' || env.SLOT == '0 13 * * *' || contains(github.event.head_commit.message, '[threads-pv]'))
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python -m engine threads --pv-post
          git add data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 미리보기 게시 기록"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 쓰레드 전날 결과 게시(11:00 · 빠지면 13:00·18:00)
        if: steps.commit.outputs.pushed == '1' && (env.SLOT == '0 2 * * *' || env.SLOT == '0 4 * * *' || env.SLOT == '0 9 * * *' || contains(github.event.head_commit.message, '[threads-result]'))
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python -m engine threads --result-post
          git add data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 결과 게시 기록"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 검색엔진에 새 페이지 알림(IndexNow·구글 서치 콘솔)
        if: env.SKIP != '1' && (steps.commit.outputs.pushed == '1')
        continue-on-error: true
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          # 앞 단계 '사이트 빌드 검증'에서 만든 dist 를 그대로 쓴다(다시 빌드하지 않아 실행 시간 절약)
          [ -f dist/data/urls.json ] || python -m engine build >/dev/null
          python -m engine indexnow
          git add data/state/gsc.json data/state/indexnow.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "data: 구글 색인 요청 기록"
          for i in 1 2 3 4; do
            if git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 쓰레드가 안 올라갔으면 바로 다시(쓰레드 다시 올리기 시작)
        if: always() && (env.SLOT == '0 22 * * *' || env.SLOT == '30 0 * * *' || env.SLOT == '0 10 * * *' || env.SLOT == '0 13 * * *' || env.SLOT == '0 2 * * *' || env.SLOT == '0 4 * * *' || env.SLOT == '0 9 * * *' || env.SLOT == '0 6 * * *' || env.SLOT == '0 8 * * *')
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          case "$SLOT" in
            "0 22 * * *"|"0 10 * * *") kinds="analysis" ;;
            "30 0 * * *") kinds="analysis preview" ;;
            "0 13 * * *") kinds="analysis kh preview" ;;
            "0 2 * * *"|"0 9 * * *") kinds="result" ;;
            "0 4 * * *") kinds="result preview" ;;
            "0 6 * * *") kinds="kh" ;;
            "0 8 * * *") kinds="preview" ;;
          esac
          for k in $kinds; do
            if [ "$(python -m engine threads --due "$k")" = "yes" ]; then
              echo "$k 아직 안 올라감 → 다시 올리기 시작"
              curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/threads.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"kind\":\"$k\",\"attempt\":\"1\"}}" -w " %{http_code}\n" -o /tmp/disp.txt || { echo "시작 요청 실패"; cat /tmp/disp.txt; }
            fi
          done
