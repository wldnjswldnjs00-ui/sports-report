name: 쓰레드 다시 올리기

# 정해진 시각의 쓰레드 글이 안 올라갔으면(카드 준비 오류·배포 지연·쓰레드 API 오류) 몇 분 안에 다시 올린다.
# '매일 분석'이 끝날 때 아직 안 올라갔으면 이 워크플로를 바로 시작하고, 여기서도 안 되면 1분 30초 뒤 자기 자신을 다시 시작한다(최대 6번 ≈ 25분).
# 수집·분석은 하지 않고 카드 준비 → 커밋(사이트 배포) → 게시만 한다. 이미 올라갔으면 아무것도 하지 않는다.
run-name: ${{ format('쓰레드 다시 올리기 · {0} · {1}번째', inputs.kind, inputs.attempt) }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "analysis | result | kh | kh-redo | preview"
        required: true
      attempt:
        description: "몇 번째 시도"
        required: false
        default: "1"

concurrency:
  group: threads-retry-${{ inputs.kind }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND: ${{ inputs.kind }}
      ATTEMPT: ${{ inputs.attempt }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}  # 경기를 다시 받아 올 때 해외 배당 분석에 필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 아직 안 올라갔는지
        id: due
        run: |
          # 다시 올리기는 처음 실행에서 카드를 준비해야 '해야 할 일'이 생긴다
          if [ "$KIND" = "kh-redo" ]; then source .github/scripts/chrome.sh && python -m engine threads --kh-redo-prepare; fi
          echo "due=$(python -m engine threads --due "$KIND")" >> "$GITHUB_OUTPUT"
      - name: 카드 준비
        if: steps.due.outputs.due == 'yes'
        continue-on-error: true
        run: |
          source .github/scripts/chrome.sh
          case "$KIND" in
            analysis) THREADS_COLLECT=1 python -m engine threads --prepare ;;
            result)   python -m engine threads --result-prepare ;;
            kh)       python -m engine threads --knowhow-prepare ;;
            kh-redo)  python -m engine threads --kh-redo-prepare ;;
            preview)  python -m engine threads --pv-prepare ;;
          esac
      - name: 커밋(사이트에 카드 이미지 배포)
        id: commit
        if: steps.due.outputs.due == 'yes'
        run: |
          git config user.name "report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: 쓰레드 카드 다시 준비($KIND)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 5))
          done
          exit 1
      - name: 게시
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          case "$KIND" in
            analysis) python -m engine threads --post ;;
            result)   python -m engine threads --result-post ;;
            kh)       python -m engine threads --knowhow ;;
            kh-redo)  python -m engine threads --kh-redo-post ;;
            preview)  python -m engine threads --pv-post ;;
          esac
          git add data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 쓰레드 게시 기록($KIND)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((i * 5))
          done
      - name: 그래도 안 됐으면 1분 30초 뒤 다시
        if: always() && steps.due.outputs.due == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const still = execSync(`python -m engine threads --due ${process.env.KIND}`).toString().trim();
            const n = Number(process.env.ATTEMPT || "1");
            if (still !== "yes") { core.info("게시 완료"); return; }
            let maxN = 6;
            try { if (JSON.parse(require("fs").readFileSync("data/state/minutes.json", "utf8")).mode === "minimal") maxN = 2; } catch (e) {}
            if (n >= maxN) { core.warning(`${maxN}번 시도 후에도 게시되지 않음 — 다음 정해진 시각이 이어받음`); return; }
            await new Promise((r) => setTimeout(r, 90000));
            await github.rest.actions.createWorkflowDispatch({ owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "threads.yml", ref: "main", inputs: { kind: process.env.KIND, attempt: String(n + 1) } });
            core.info(`다시 시작: ${n + 1}번째`);
